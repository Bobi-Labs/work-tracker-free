name: Deploy

# Builds the static site and publishes it to GitHub Pages.
#
# Pages serves a project repo from a SUB-PATH (<org>.github.io/<repo>/), so this
# build sets BASE_PATH. That flag exists for exactly this case — the default
# build has no basePath, because a domain root, a `file://` open and a desktop
# shell all require none. See next.config.mjs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-flight; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — package.json's "packageManager" field is
      # the single source of truth. Specifying both makes action-setup fail with
      # ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate the deploy on the suite. A board is someone's data; a green deploy
      # of a broken store is worse than no deploy.
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
