<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bobi Tracker">
  <!-- The glowy-orb family mark: the operator's suite (bobilabs.dev, the
       freelance site, the personal page) all use glowing spheres as favicons,
       each in its own colour, so suite users can spot the tabs at a glance.
       Bobi Tracker's orb is indigo, the app accent. -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#e0e7ff"/>
      <stop offset="30%" stop-color="#a5b4fc"/>
      <stop offset="65%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </radialGradient>
    <radialGradient id="sheen" cx="36%" cy="26%" r="28%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="24" fill="url(#ball)"/>
  <circle cx="32" cy="32" r="24" fill="url(#sheen)"/>
</svg>
